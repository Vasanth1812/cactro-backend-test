# PostgreSQL configuration for Neon / Render Production
# Can be overridden by environment variables in Render
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-cold-morning-ap4zqwff-pooler.c-7.us-east-1.aws.neon.tech/cactro?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_l7yTsNJmp9SI}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 console in production
spring.h2.console.enabled=false

# HikariCP connection pool settings optimized for Neon serverless PostgreSQL
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
