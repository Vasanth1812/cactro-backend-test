spring.application.name=backend-test
server.port=${PORT:8080}

# Default to prod profile (Neon PostgreSQL, overridable by environment variable)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Enable Java 21 Virtual Threads for high-concurrency throughput
spring.threads.virtual.enabled=true

# Swagger / OpenAPI documentation path
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Mail Configuration Defaults (Overridable via environment variables in Render)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:no-reply@cactro-events.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
